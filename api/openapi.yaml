components:
  securitySchemes:
    albSession:
      type: apiKey
      in: cookie
      name: AWSELBAuthSessionCookie
    bearerAuth:
      type: http
      scheme: bearer
      description: Local AUTH_MODE=dev only; production uses the ALB session cookie and verified injected identity.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: string
        default: '100'
    Filter:
      name: filter
      in: query
      schema:
        type: string
    APIVersion:
      name: x-api-version
      in: header
      required: true
      schema:
        type: string
        enum:
        - '1'
      description: Required on business endpoints. Missing or unsupported values return 400.
  schemas:
    ProbeResponse:
      type: object
      required:
      - status
      - service
      properties:
        status:
          type: string
        service:
          type: string
          example: ddm
    AuthUser:
      type: object
      properties:
        sub:
          type: string
        username:
          type: string
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
      required:
      - sub
      - username
      - roles
    User:
      type: object
      properties:
        username:
          type: string
        sub:
          type: string
        email:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        status:
          type: string
        roles:
          type: array
          items:
            type: string
      required:
      - username
      - enabled
      - status
      - roles
    CreateUserRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
      required:
      - username
      - email
      - roles
    PolicyRow:
      type: object
      required:
      - role
      - permissions
      properties:
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
    AuditSessionSummary:
      type: object
      required:
      - sessionId
      - userId
      - hostId
      - crId
      - connectionType
      - status
      - createdAt
      - lastAuditAt
      - recordCount
      - truncated
      properties:
        sessionId:
          type: string
        userId:
          type: string
        hostId:
          type: string
        crId:
          type: string
        connectionType:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        lastAuditAt:
          type: string
          format: date-time
        recordCount:
          type: integer
        truncated:
          type: boolean
    ListAuditSessionsResponse:
      type: object
      required:
      - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AuditSessionSummary'
        nextCursor:
          type: string
    SessionAuditRecord:
