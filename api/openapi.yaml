openapi: 3.1.0
info:
  title: DenDenMushi Nest Backend API
  version: 0.1.0
  description: 'Web application API for auth, identity administration, change requests, inventory, implementer groups,
    sessions, and monitoring. Business endpoints require the `x-api-version: 1` header; health, readiness, OpenAPI,
    root, ALB login/logout redirects, and the SNS alert webhook are exempt. Terminal session APIs are owned by Proxy
    Control Plane at /sessions; Nest does not serve /ddm/sessions. Internal /servers and /sts routes rely on cluster
    network restrictions. Login, logout, probes, specification and the SNS webhook are exempt from API version checks.'
servers:
- url: https://api.ddm.keiyam.me
  description: AWS dev public origin.
- url: http://localhost:3000
  description: Direct service address; public services are accessed through the authenticated ALB.
paths:
  /healthz:
    get:
      summary: Liveness probe outside the /ddm prefix
      security: []
      responses:
        '200':
          description: Process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResponse'
  /readyz:
    get:
      summary: Readiness probe outside the /ddm prefix
      security: []
      responses:
        '200':
          description: Process and PostgreSQL are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResponse'
        '503':
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - unavailable
                  service:
                    type: string
                    enum:
                    - ddm
                required:
                - status
                - service
  /servers/{hostId}:
    get:
      summary: Internal STS server inventory lookup
      description: Resolves a webapp VM UUID or gateway host ID to the SSH target metadata required by STS.
      security: []
      parameters:
      - name: hostId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/APIVersion'
      responses:
        '200':
          description: Server inventory record.
          content:
            application/json:
              schema:
                type: object
                required:
                - hostId
                - hostname
                - address
                - status
                - connectionType
                - username
                - credentialSecretId
                - hostPublicKey
                properties:
                  hostId:
                    type: string
                  hostname:
                    type: string
                  address:
                    type: string
                  status:
                    type: string
                  connectionType:
                    type: string
                    enum:
                    - ssh
                  username:
                    type: string
                  credentialSecretId:
                    type: string
                  hostPublicKey:
                    type: string
                  automation:
                    type: object
                    additionalProperties: true
        '404':
          description: Server not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server exists but SSH inventory metadata is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /sts/change-requests/{crId}:
    get:
      summary: Internal STS change-request lookup
      description: Returns trusted approval status, UTC implementation window, role entitlement and explicit gateway
        host scope for STS.
      security: []
      parameters:
      - name: crId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/APIVersion'
      responses:
        '200':
          description: Change-request authorization metadata.
          content:
            application/json:
              schema:
                type: object
                required:
                - crId
                - status
                - hostIds
                - implementationStartAt
                - implementationEndAt
                - allowedRoles
                properties:
                  crId:
                    type: string
                  status:
                    type: string
                    enum:
                    - Pending
                    - Approved
                    - Rejected
                  implementationStartAt:
                    type: string
                    format: date-time
                  implementationEndAt:
                    type: string
                    format: date-time
                  allowedRoles:
                    type: array
                    items:
                      type: string
                    description: Cognito groups entitled to the CR. Empty denies ordinary actors; Admin bypasses
                      role matching only.
                  hostIds:
                    type: array
                    items:
                      type: string
        '404':
          description: Change request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /ddm/auth/config:
    get:
      summary: Get frontend authentication configuration
      security: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/APIVersion'
  /ddm/auth/login:
    get:
      summary: Start ALB/Cognito login redirect
      security: []
      responses:
        '302':
          description: Redirect to the authenticated app.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /ddm/auth/logout:
    get:
      summary: Expire ALB auth cookies and redirect through Cognito logout
      security: []
      responses:
        '302':
          description: Redirect after logout.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /ddm/auth/dev-login:
    post:
      summary: Development-only login helper
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              properties:
                username:
                  type: string
      responses:
        '400':
          $ref: '#/components/responses/Error'
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevLoginResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/APIVersion'
  /ddm/auth/me:
    get:
      summary: Get the authenticated user
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/APIVersion'
  /ddm/identity/roles:
    get:
      summary: List supported identity roles
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityRoles'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/APIVersion'
  /ddm/identity/users:
    get:
      summary: List Cognito users
      responses:
        '200':
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/APIVersion'
    post:
      summary: Create a Cognito user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/APIVersion'
  /ddm/identity/users/{username}/status:
    patch:
      summary: Enable or disable a Cognito user
      parameters:
      - $ref: '#/components/parameters/Username'
      - $ref: '#/components/parameters/APIVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /ddm/identity/users/{username}/roles:
    put:
      summary: Replace Cognito user roles
      parameters:
      - $ref: '#/components/parameters/Username'
      - $ref: '#/components/parameters/APIVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - roles
              properties:
                roles:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /ddm/identity/policies:
    get:
      summary: List role permission policies
      responses:
        '200':
          description: Policy rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyRow'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/APIVersion'
    put:
      summary: Replace role permission policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - policies
              properties:
                policies:
                  type: array
                  items:
                    $ref: '#/components/schemas/PolicyRow'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyRow'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/APIVersion'
  /ddm/change-requests:
    get:
      summary: List change requests
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChangeRequest'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/APIVersion'
    post:
      summary: Create a change request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChangeRequest'
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/APIVersion'
  /ddm/change-requests/accessible:
    get:
      summary: List change requests accessible to the authenticated user
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChangeRequest'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/APIVersion'
  /ddm/change-requests/{id}:
    get:
      summary: Get a change request
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/APIVersion'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    patch:
      summary: Update a change request
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/APIVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChangeRequest'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /ddm/change-requests/{id}/approve:
    patch:
      summary: Approve a change request
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/APIVersion'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /ddm/change-requests/{id}/reject:
    patch:
      summary: Reject a change request
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/APIVersion'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /ddm/inventory/vms:
    get:
      summary: List virtual machines
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VirtualMachine'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/APIVersion'
    post:
      summary: Create a virtual machine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualMachineInput'
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualMachine'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/APIVersion'
  /ddm/inventory/vms/sync:
    post:
      summary: Sync virtual machines from inventory records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                servers:
                  type: array
                  items:
                    $ref: '#/components/schemas/SyncVirtualMachine'
              required:
              - servers
      responses:
        '400':
          $ref: '#/components/responses/Error'
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: integer
                  updated:
                    type: integer
                  unchanged:
                    type: integer
                required:
                - created
                - updated
                - unchanged
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/APIVersion'
  /ddm/inventory/vms/{id}:
    get:
      summary: Get a virtual machine
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/APIVersion'
