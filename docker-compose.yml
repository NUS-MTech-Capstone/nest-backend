services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ddm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ddmpassword}
      POSTGRES_DB: ${DB_NAME:-ddm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-ddm} -d ${DB_NAME:-ddm}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    profiles: ['cache']
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-ddm}
      DB_PASSWORD: ${DB_PASSWORD:-ddmpassword}
      DB_NAME: ${DB_NAME:-ddm}
      DB_LOGGING: ${DB_LOGGING:-false}
      AUTH_MODE: ${AUTH_MODE:-dev}
      DEV_JWT_SECRET: ${DEV_JWT_SECRET:-dev-secret-change-me}
      CORS_ENABLED: ${CORS_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      REDIS_CACHE_ENABLED: ${REDIS_CACHE_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MONITORING_CACHE_TTL_SECONDS: ${MONITORING_CACHE_TTL_SECONDS:-60}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/readyz || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  redisdata:
